services:
  api:
    build: .
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      CHROMA_DIR: /app/chroma_db
      DOCS_DIR: /app/documents
    volumes:
      - ./documents:/app/documents
      - chroma:/app/chroma_db
      - hf_cache:/models/hf
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  chroma:
  hf_cache: